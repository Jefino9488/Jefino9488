version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automerge"
    ignore:
      # Prevent bumping to pre-release / unsupported major TypeScript versions
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
